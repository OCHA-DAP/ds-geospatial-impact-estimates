<!-- Client-side access gate, same pattern as
     ds-aa-lac-dry-corridor/analysis/2026_cadc_drought_v3/password.html and
     OCHA-DAP/ds-geospatial-impact-exposure.

     READ THIS BEFORE RELYING ON IT: this is a speed bump, not access control. The
     password sits in plaintext a few lines below, the whole deck is already in the
     downloaded HTML before the prompt appears, and on a public repo the file can be
     fetched directly from github.com without ever hitting this script. It keeps a casual
     visitor from stumbling into the deck. It does not keep anyone out who wants in. -->
<script>
(function () {
  var PASSWORD = "ve2026";
  if (sessionStorage.getItem("gie-auth") === "true") return;
  var pwd = window.prompt("This deck is internal. Enter the password to view it:");
  if (pwd !== PASSWORD) {
    document.addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML =
        '<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;' +
        'text-align:center;margin-top:18vh;color:#1f2324">' +
        '<h1 style="color:#1e795f;font-weight:700">Access denied</h1>' +
        '<p style="color:#5e6a6b">This deck is internal to the OCHA Centre for ' +
        'Humanitarian Data. Contact the authors for access.</p></div>';
    });
    throw new Error("access denied");
  }
  sessionStorage.setItem("gie-auth", "true");
})();
</script>
