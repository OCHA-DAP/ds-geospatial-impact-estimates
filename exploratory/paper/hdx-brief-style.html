<!-- HDX v2 design-system styling for the technical brief.
     Tokens mirrored in ds-knowledge-base-internal/style-reference/tokens.md; the team
     default per ds-knowledge-base/methods/style-guide.md. Colours are the HDX ramps
     (brand = CHD green, primary = blue, neutral); type is Merriweather display +
     Roboto body, as the design system specifies. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* --- HDX v2 tokens (subset actually used here) --- */
  --hdx-brand-1:#d4eae4; --hdx-brand-2:#a8d5c9; --hdx-brand-4:#51ac92;
  --hdx-brand-5:#269777; --hdx-brand-6:#1e795f; --hdx-brand-7:#18614c;
  --hdx-brand-8:#0f3c30; --hdx-brand-85:#0b2d24;
  --hdx-primary-2:#a3c0ef; --hdx-primary-6:#134ead; --hdx-primary-8:#0a2756;
  --hdx-neutral-01:#fafbfb; --hdx-neutral-1:#ebeff0; --hdx-neutral-2:#d8e0e1;
  --hdx-neutral-3:#c4d0d1; --hdx-neutral-5:#9db1b3; --hdx-neutral-7:#5e6a6b;
  --hdx-neutral-8:#3f4748; --hdx-neutral-85:#2f3536;
  --hdx-font-display:'Merriweather', Georgia, serif;
  --hdx-font-body:'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hdx-radius-sm:2px; --hdx-radius-md:4px;
  --hdx-shadow-sm:0 1px 4px rgba(0,0,0,0.04);
}

body { font-family: var(--hdx-font-body); color: var(--hdx-neutral-85); }

/* --- the banner ---------------------------------------------------------- */
#title-block-header.quarto-title-block.default {
  position: relative;
  margin: -1.5em calc(50% - 50vw) 2.6rem;
  padding: 3.1rem calc(50vw - 50%) 2.1rem;
  background: linear-gradient(135deg, var(--hdx-brand-6) 0%, var(--hdx-brand-8) 58%, var(--hdx-brand-85) 100%);
  border-bottom: 3px solid var(--hdx-brand-4);
  color: #fff;
}
/* the dot field echoes the particle-network background used on the team's decks */
#title-block-header.quarto-title-block.default::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1.3px);
  background-size: 22px 22px; opacity:.5;
}
#title-block-header .quarto-title, #title-block-header .quarto-title-meta { position:relative; z-index:1; }
#title-block-header h1.title {
  font-family: var(--hdx-font-display); font-weight: 900; color: #fff;
  font-size: clamp(1.7rem, 3.1vw, 2.45rem); line-height: 1.18; letter-spacing: -0.015em;
  margin: 0 0 .55rem; text-wrap: balance; border: 0;
}
#title-block-header .quarto-title-meta,
#title-block-header .quarto-title-meta a { color: var(--hdx-brand-2); }
#title-block-header .quarto-title-meta-heading {
  font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--hdx-brand-4);
}
#title-block-header .quarto-title-meta-contents { font-size: .92rem; }
#title-block-header .quarto-title-meta-contents em { color: var(--hdx-brand-2); font-style: normal; }

/* --- headings ------------------------------------------------------------- */
h2, h3, h4 { font-family: var(--hdx-font-display); color: var(--hdx-brand-8); }
h2 { font-weight: 900; border-bottom: 1px solid var(--hdx-neutral-2); padding-bottom: .3rem; margin-top: 2.5rem; }
h3 { font-weight: 700; color: var(--hdx-brand-7); }
h2 .header-section-number, h3 .header-section-number { color: var(--hdx-brand-4); font-weight: 700; }
a { color: var(--hdx-primary-6); }
a:hover { color: var(--hdx-brand-6); }

/* --- recommendations ------------------------------------------------------ */
.rec { border-top: 1px solid var(--hdx-neutral-2); }
.rec-who { color: var(--hdx-brand-6); }
.rec ol > li::marker { color: var(--hdx-brand-5); }

/* --- tables and figures --------------------------------------------------- */
.quarto-float-caption, figcaption, caption { font-size: .86rem; color: var(--hdx-neutral-7); }
.quarto-float-caption strong, figcaption strong { color: var(--hdx-neutral-85); }
#quarto-document-content table:not(.gt_table) thead th { border-bottom: 2px solid var(--hdx-brand-4); }
.gt_table { font-family: var(--hdx-font-body) !important; }
.gt_col_heading, .gt_column_spanner { color: var(--hdx-brand-8) !important; }
.gt_sourcenote { color: var(--hdx-neutral-7) !important; font-size: .78rem !important; }

/* --- table of contents ---------------------------------------------------- */
/* the banner is full-bleed and the TOC is sticky, so at the top of the page the TOC sits
   over dark green; give it its own surface so it reads in both positions */
nav#TOC {
  background: #fff; border: 1px solid var(--hdx-neutral-2);
  border-radius: var(--hdx-radius-md); box-shadow: var(--hdx-shadow-sm);
  padding: .85rem 1rem .95rem; margin-top: .4rem;
}
nav#TOC > h2, nav#TOC .h2, nav#TOC .toc-actions { color: var(--hdx-brand-8); }
#TOC .nav-link.active, #TOC .nav-link:hover { color: var(--hdx-brand-6); border-left-color: var(--hdx-brand-4); }

@media (max-width: 700px) {
  #title-block-header.quarto-title-block.default { padding-top: 2.1rem; padding-bottom: 1.5rem; }
}
</style>
