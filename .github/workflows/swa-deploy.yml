# Deploy the SPA to the Static Web App (chd-ds-satellite-impact-viewer) — the parallel
# v2 host (ADR-0011 Phase 3 / ADR-0020). Runs ALONGSIDE the classic App Service deploy
# (azure-deploy.yml, v1 branch), which is untouched.
#
# Environments:
#   push to the production branch  -> SWA production env: prod token tier; no legacy API — severed 2026-08
#   pull_request to that branch    -> SWA PREVIEW env (own temp URL): staging tier + the
#                                     staging App Service slot — review changes against
#                                     staging data before they reach the public URL.
#
# Auth: SWA deployment token in the AZURE_STATIC_WEB_APPS_API_TOKEN repo secret
# (no Azure login / publish profile needed).
name: Deploy SWA (satellite-impact-viewer)

on:
  push:
    branches: [v1]
    paths: ["web/**", "api-spike/**", ".github/workflows/swa-deploy.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [v1]
    paths: ["web/**", "api-spike/**", ".github/workflows/swa-deploy.yml"]

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SPIKE ONLY (branch spike/form-auth): the managed Function reads its secrets from a file written
      # here, because the spike cannot set Static Web App settings. Not the production pattern.
      # SPIKE_BLOB_SAS is a SAS scoped to the one directory the spike writes (read, write, list; no
      # delete), minted by hand on 2026-11-21, expires 2027-05-22. The org-wide dev write SAS is not used.
      - name: Write spike secrets for the managed Function
        run: |
          test -n "${{ secrets.SPIKE_LISTMONK_KEY }}" || { echo "SPIKE_* secrets not set"; exit 1; }
          test -n "${{ secrets.SPIKE_BLOB_SAS }}" || { echo "SPIKE_BLOB_SAS not set: the directory-scoped SAS for the spike submissions folder"; exit 1; }
          test -n "${{ secrets.SPIKE_LISTMONK_MANAGE_KEY }}" || { echo "SPIKE_LISTMONK_MANAGE_USER/KEY not set: sign-up needs a Listmonk key with subscribers:manage (see PR #174)"; exit 1; }
          printf '%s' '{"listmonk_base_url":"${{ secrets.SPIKE_LISTMONK_BASE_URL }}","listmonk_user":"${{ secrets.SPIKE_LISTMONK_USER }}","listmonk_key":"${{ secrets.SPIKE_LISTMONK_KEY }}","signing_secret":"${{ secrets.SPIKE_SIGNING_SECRET }}","blob_sas":"${{ secrets.SPIKE_BLOB_SAS }}","listmonk_manage_user":"${{ secrets.SPIKE_LISTMONK_MANAGE_USER }}","listmonk_manage_key":"${{ secrets.SPIKE_LISTMONK_MANAGE_KEY }}"}' > api-spike/secrets.json
      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # lets the action comment the preview URL on PRs
          action: upload
          app_location: web
          api_location: api-spike
          output_location: dist
          production_branch: v1
        env:
          VITE_TOKEN_URL: https://chd-ds-token-issuer.azurewebsites.net/api/token?app=satellite-viewer&tier=${{ github.event_name == 'pull_request' && 'staging' || 'prod' }}

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
