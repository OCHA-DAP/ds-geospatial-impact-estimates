# Build once, deploy to the staging slot, then (on approval) to production.
# Auth is per-slot publish profiles (GitHub secrets); the app name is a repo
# variable — so no infra names live in this file.
#
# Required repo config (Settings):
#   Variables: AZURE_WEBAPP_NAME            = the web app name
#   Secrets:   AZURE_PUBLISH_PROFILE_STAGING     = staging slot publish profile (XML)
#              AZURE_PUBLISH_PROFILE_PRODUCTION   = production slot publish profile (XML)
#   Environments: "staging" (no protection) and "production" (add a required
#                 reviewer — that reviewer approval is the prod gate).
#
# App Service runtime config (set in the Portal, persists across deploys):
#   Startup: gunicorn asgi:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000
#   App settings: STAGE, GIE_BLOB_ACCOUNT_PREFIX, DSCI_AZ_BLOB_<STAGE>_SAS,
#                 SCM_DO_BUILD_DURING_DEPLOYMENT=true, Always On.

name: Deploy to Azure App Service

on:
  push:
    branches: [v1]
    # Don't redeploy the app for changes that don't affect it (docs, diagrams,
    # exploratory analysis, the workflow itself, local scripts). A push touching
    # ONLY these is skipped; a push that also changes app code still deploys. Use
    # "Run workflow" (workflow_dispatch) to deploy manually regardless.
    paths-ignore:
      - "docs/**"
      - "exploratory/**"
      - "**.md"
      - ".gitignore"
      - ".github/**"
      - "scripts/**"
      - ".env.example"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lock serving requirements
        run: uv export --no-dev --group api --no-emit-project --no-hashes -o requirements.txt

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            api
            src
            web/dist
            asgi.py
            requirements.txt

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production # add a required reviewer here = the prod approval gate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy to production slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PRODUCTION }}
