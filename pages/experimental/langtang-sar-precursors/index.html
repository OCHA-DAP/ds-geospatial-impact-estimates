<!-- The report itself is content.enc — AES-GCM ciphertext, not readable HTML. Built by
     exploratory/0005-nepal-glof-sar-precursor/reports/build_reports.py into the gitignored
     data/langtang-sar-precursors.page.html, then encrypted here with the EXPERIMENTAL
     passphrase (not the damage-evaluation one):

       ./scripts/publish_experimental.sh                                                  -->

<form class="gate" data-gate data-enc="content.enc">
  <p class="eyebrow">OCHA Centre for Humanitarian Data · Experimental</p>
  <h1>Nepal glacier collapse — SAR precursor analysis</h1>
  <p class="lede">Six years of Sentinel-1 radar over the Langtang Lirung face that collapsed on
     26 Aug 2026. Exploratory; enter the experimental passphrase to open it.</p>

  <label for="pass">Passphrase</label>
  <input id="pass" type="password" autocomplete="current-password" data-gate-input
         placeholder="Experimental passphrase">
  <p class="msg" role="status" aria-live="polite" data-gate-message></p>
  <button type="submit" data-gate-submit>Open</button>

  <p class="back"><a href="../">← Experimental analyses</a></p>
</form>

<script type="module" src="../../assets/gate.js"></script>
