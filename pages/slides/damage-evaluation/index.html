<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite damage product evaluation — passphrase required</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site.css">
</head>
<body class="gate-page">

<!-- The deck itself is content.enc — AES-GCM ciphertext, not readable HTML. This form derives
     the key from the passphrase and decrypts it in the browser; the decrypted document then
     replaces this one. Re-encrypt after re-rendering:

       uv run --with cryptography python scripts/encrypt_page.py \
         --in  exploratory/paper/satellite_damage_evaluation_v2.html \
         --out pages/slides/damage-evaluation/content.enc                                  -->

<form class="gate" data-gate data-enc="content.enc">
  <p class="eyebrow">OCHA Centre for Humanitarian Data</p>
  <h1>Satellite damage product evaluation</h1>
  <p class="lede">Results deck — six rapid building-damage products from the M7.5 Venezuela
     earthquake, scored against three reference datasets. Pre-publication; enter the shared
     passphrase to open it.</p>

  <label for="pass">Passphrase</label>
  <input id="pass" type="password" autocomplete="current-password" data-gate-input
         placeholder="Shared passphrase">
  <p class="msg" role="status" aria-live="polite" data-gate-message></p>
  <button type="submit" data-gate-submit>Open</button>

  <p class="back"><a href="../../">← All analysis &amp; tools</a></p>
</form>

<script type="module" src="../../assets/gate.js"></script>
</body>
</html>
