[project]
name = "ds-geospatial-impact-estimates"
version = "0.1.0"
description = "Viewer and harmonization layer for multi-source, satellite-derived damage exposure estimates."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # Data engine: DuckDB reads/writes GeoParquet directly on Azure Blob and is
    # both ETL and serving engine for v1 (see docs/decisions/0002).
    # The spatial / azure / h3 DuckDB extensions are installed at runtime, not via pip.
    "duckdb>=1.1",
    # Vector / raster handling on the Python side.
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=17",
    "h3>=4.1",
    "pandas>=2.2",
    # Azure auth for the DuckDB azure extension's credential chain.
    "azure-identity>=1.19",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "mypy>=1.13",
    "ipykernel>=6.29",
    "pre-commit>=4.0",
]
# FastAPI serving layer for the deck.gl + MapLibre front end (ADR-0004).
api = [
    "azure-storage-file-datalake>=12.25.0",
    "fastapi>=0.115",
    "gunicorn>=26.0.0",
    "openpyxl>=3.1.5",
    "uvicorn[standard]>=0.32",
]
# One-time ingestion loaders only (not the runtime query path; see ADR-0003).
etl = [
    "ocha-lens",
    "ocha-stratus>=0.1.7",
]
paper = [
    "contextily>=1.7.1",
    "cryptography>=49.0.0",
    "great-tables>=0.24.0",
    "h3>=4.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "snakemake>=9",
    "statsmodels>=0.15.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
ocha-lens = { git = "https://github.com/OCHA-DAP/ocha-lens.git", rev = "160a92a167b427e519fa21b69bbac330367a8a5b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gie"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["gie"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
