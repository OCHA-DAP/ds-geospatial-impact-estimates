<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damage Exposure Viewer</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="map"></div>

    <div id="panel" class="floating">
      <h1>Damage Exposure</h1>
      <p class="sub">Venezuela earthquake (EMSR884)</p>

      <div class="group">
        <div class="label">Sources</div>
        <div id="sources"></div>
      </div>

      <div class="group">
        <div class="label">Building view</div>
        <select id="view">
          <option value="overture" selected>Overture base</option>
          <option value="native">Native data</option>
          <option value="agreement">Source agreement (MS vs CEMS)</option>
        </select>
      </div>

      <div class="group">
        <div class="label">Show</div>
        <label><input type="checkbox" data-layer="admin" checked /> Admin aggregation</label>
        <label><input type="checkbox" data-layer="buildings" /> Buildings</label>
        <label><input type="checkbox" data-layer="extent" checked /> Coverage extent</label>
        <label><input type="checkbox" data-layer="h3" /> H3 hexagons</label>
      </div>

      <div class="group">
        <div class="label">Colour aggregation by</div>
        <select id="metric"></select>
      </div>

      <div class="group">
        <div class="label">Admin level</div>
        <select id="adminLevel">
          <option value="0">Admin 0</option>
          <option value="1">Admin 1</option>
          <option value="2">Admin 2</option>
          <option value="3" selected>Admin 3</option>
        </select>
      </div>

      <div class="group">
        <div class="label">Basemap</div>
        <label><input type="checkbox" id="satellite" /> Satellite imagery</label>
      </div>

      <div class="group">
        <a id="export" href="/api/export.xlsx" download>⬇ Download spreadsheet (.xlsx)</a>
      </div>

      <div id="status" class="status">Loading…</div>
    </div>

    <div id="legend" class="floating"></div>
    <div id="tooltip"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
