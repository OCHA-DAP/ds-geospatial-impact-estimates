<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damage Exposure Viewer</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="map"></div>

    <div id="panel" class="floating">
      <h1>Damage Exposure</h1>
      <p class="sub">Catia La Mar, Venezuela · source: Microsoft (HDX, CC-BY)</p>

      <div class="group">
        <div class="label">Layers</div>
        <label><input type="checkbox" data-layer="admin" checked /> Admin units</label>
        <label><input type="checkbox" data-layer="h3" /> H3 hexagons</label>
        <label><input type="checkbox" data-layer="footprints" /> Building footprints</label>
      </div>

      <div class="group">
        <div class="label">Admin level</div>
        <select id="adminLevel">
          <option value="0">Admin 0</option>
          <option value="1">Admin 1</option>
          <option value="2">Admin 2</option>
          <option value="3" selected>Admin 3</option>
        </select>
      </div>

      <div class="group">
        <div class="label">Colour by</div>
        <label><input type="radio" name="metric" value="damaged_fraction" checked /> Damaged fraction</label>
        <label><input type="radio" name="metric" value="buildings_damaged" /> Buildings damaged</label>
        <label><input type="radio" name="metric" value="buildings_total" /> Buildings total</label>
      </div>

      <div id="status" class="status">Loading…</div>
    </div>

    <div id="legend" class="floating"></div>
    <div id="tooltip"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
